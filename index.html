<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF LOBBY PRO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(180deg,#02111f,#000);
color:#fff;
overflow-x:hidden;
}
#bg{position:fixed;inset:0;z-index:-1}
.topbar{display:flex;justify-content:space-between;padding:15px;color:#00e5ff;font-size:22px;font-weight:bold;text-shadow:0 0 10px #00e5ff}
.profile{text-align:center;padding:20px}
.gun{font-size:80px;animation:rotateGun 4s linear infinite;filter:drop-shadow(0 0 15px #00e5ff)}
.avatar{width:170px;height:170px;border:5px solid #00e5ff;border-radius:50%;margin:15px auto;display:flex;align-items:center;justify-content:center;font-size:80px;background:#06284d;box-shadow:0 0 30px #00e5ff}
.name{font-size:34px;color:#00e5ff;font-weight:bold;text-shadow:0 0 15px #00e5ff}
.level{max-width:300px;margin:20px auto}
.bar{height:14px;background:#123;border-radius:20px;overflow:hidden}
.fill{height:100%;width:75%;background:#00e5ff;box-shadow:0 0 15px #00e5ff}
.panel{background:#07131f;margin:20px;padding:20px;border-radius:20px;box-shadow:0 0 20px #00e5ff55}
input,select{width:100%;padding:15px;margin:10px 0;border-radius:12px;border:2px solid #00e5ff;background:#111;color:#fff}
button{width:100%;padding:15px;background:#00e5ff;color:#000;font-weight:bold;border:none;border-radius:12px;box-shadow:0 0 15px #00e5ff}
.weapon{display:flex;justify-content:space-between;padding:14px;margin:10px 0;border:1px solid #00e5ff55;border-radius:12px}
#popup{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#00e5ff;color:#000;padding:10px 18px;border-radius:10px;font-weight:bold;display:none;box-shadow:0 0 20px #00e5ff}
@keyframes rotateGun{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<div id="popup">WELCOME TO FF LOBBY PRO</div>

<div class="topbar">
<div>💎99999</div>
<div>🪙999999</div>
</div>

<div class="profile">
<div class="gun">🔫</div>
<div class="avatar">🎮</div>
<div class="name">FF LOBBY PRO</div>

<div class="level">
Level 75
<div class="bar"><div class="fill"></div></div>
</div>
</div>

<div class="panel">
<input id="uid" placeholder="Enter UID">
<select>
<option>India</option>
<option>Brazil</option>
<option>Singapore</option>
</select>
<button onclick="scan()">START</button>
<div id="status" style="display:none;margin-top:15px;text-align:center">
<h3>✅ Scan Complete</h3>
<p>Demo Lobby Ready</p>
</div>
</div>

<div class="panel">
<h2 style="color:#00e5ff;margin-bottom:15px">Popular Weapons</h2>
<div class="weapon"><span>🔫 AK47</span><span>Epic</span></div>
<div class="weapon"><span>⚡ MP40</span><span>Legendary</span></div>
<div class="weapon"><span>🎯 M1887</span><span>Mythic</span></div>
<div class="weapon"><span>🔥 M1014</span><span>Ultra</span></div>
</div>

<script>
function scan(){
let uid=document.getElementById("uid").value;
if(uid==""){alert("Enter UID");return;}
document.getElementById("status").style.display="block";
}

const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
window.onresize=resize;

let p=[];
for(let i=0;i<70;i++){
p.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*3+1,v:Math.random()+0.3});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#00e5ff";
for(let a of p){
ctx.beginPath();
ctx.arc(a.x,a.y,a.r,0,Math.PI*2);
ctx.fill();
a.y-=a.v;
if(a.y<0)a.y=canvas.height;
}
requestAnimationFrame(draw);
}
draw();

setTimeout(()=>{
const popup=document.getElementById("popup");
popup.style.display="block";
setTimeout(()=>popup.style.display="none",2500);
},1000);
</script>

</body>
</html>
