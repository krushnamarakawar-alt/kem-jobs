<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="_ceg4_0qv9vuG2dC_uQJWeyBrQLMW45URNV8gHQ2jxM" />
<title>KEM Jobs</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<header class="bg-blue-700 text-white p-5">
  <h1 class="text-3xl font-bold">KEM Jobs</h1>
  <p>Find Jobs Across India</p>
</header>

<section class="max-w-5xl mx-auto p-5">
  <div class="bg-white rounded-2xl shadow p-5">
    <h2 class="text-2xl font-bold mb-3">Search Jobs</h2>
    <div class="grid gap-3 md:grid-cols-3">
      <input class="border p-3 rounded-xl" placeholder="Job Title">
      <input class="border p-3 rounded-xl" placeholder="City">
      <button class="bg-blue-700 text-white rounded-xl p-3">Search</button>
    </div>
  </div>

  <h2 class="text-2xl font-bold mt-8 mb-4">Latest Jobs</h2>

  <div class="grid gap-4 md:grid-cols-3">
    <div class="bg-white rounded-2xl shadow p-4">
      <h3 class="font-bold">Data Entry Operator</h3>
      <p>Pune • ₹18,000</p>
      <a href="#apply-form" class="mt-3 inline-block bg-green-600 text-white px-4 py-2 rounded">
  Apply Now
</a>
    </div>

    <div class="bg-white rounded-2xl shadow p-4">
      <h3 class="font-bold">Hospital Receptionist</h3>
      <p>Mumbai • ₹22,000</p>
      <a href="#apply-form" class="mt-3 inline-block bg-green-600 text-white px-4 py-2 rounded">
  Apply Now
</a>
    </div>

    <div class="bg-white rounded-2xl shadow p-4">
      <h3 class="font-bold">Delivery Executive</h3>
      <p>Nagpur • ₹25,000</p>
      <a href="#apply-form" class="mt-3 inline-block bg-green-600 text-white px-4 py-2 rounded">
  Apply Now
      </a>
    </div>
  </div>
</section>
  <section id="apply-form" class="max-w-3xl mx-auto p-5">
  <div class="bg-white rounded-2xl shadow p-5">
    <h2 class="text-2xl font-bold mb-4">Apply for Job</h2>

    <form action="https://formsubmit.co/krushna123@gmail.com" method="POST" enctype="multipart/form-data">
      <input type="text" name="name" placeholder="Full Name" class="w-full border p-3 rounded mb-3" required>

      <input type="email" name="email" placeholder="Email" class="w-full border p-3 rounded mb-3" required>

      <input type="tel" name="phone" placeholder="Mobile Number" class="w-full border p-3 rounded mb-3" required>

      <input type="file" name="resume" class="w-full border p-3 rounded mb-3" required>

      <button type="submit" class="w-full bg-blue-700 text-white p-3 rounded-xl">
        Submit Application
      </button>
    </form>
  </div>
  </section>

<footer class="bg-gray-900 text-white text-center p-4 mt-10">
  © 2026 KEM Jobs
</footer>

</body>
</html>
