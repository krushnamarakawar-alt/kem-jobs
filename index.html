<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF BOT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#050505;color:#fff;overflow:hidden}
#intro{
position:fixed;inset:0;background:#000;
display:flex;justify-content:center;align-items:center;
flex-direction:column;z-index:999;
animation:hide 3s forwards;
}
#intro h1{color:#00e5ff;font-size:40px;text-shadow:0 0 20px #00e5ff}
@keyframes hide{0%,80%{opacity:1}100%{opacity:0;visibility:hidden}}

.main{
display:flex;justify-content:center;align-items:center;
height:100vh;
background:radial-gradient(circle,#0a1b35,#050505);
}
.card{
width:340px;background:#111;padding:25px;border-radius:20px;
box-shadow:0 0 25px #00e5ff55;text-align:center;
}
h2{color:#00e5ff;margin-bottom:10px}
input,select,button{
width:100%;padding:12px;margin:10px 0;border:none;border-radius:10px;
}
input,select{background:#222;color:#fff}
button{
background:#00e5ff;color:#000;font-weight:bold;
box-shadow:0 0 15px #00e5ff;
}
button:active{transform:scale(.97)}
#result{display:none;margin-top:15px}
</style>
</head>
<body>

<div id="intro">
<h1>FF BOT</h1>
<p>Loading...</p>
</div>

<div class="main">
<div class="card">
<h2>🔥 FF BOT PREMIUM</h2>

<input id="uid" placeholder="Enter UID">

<select id="server">
<option>India</option>
<option>Brazil</option>
<option>Singapore</option>
<option>Middle East</option>
</select>

<button onclick="scan()">START SCAN</button>

<div id="result">
<h3>✅ Scan Complete</h3>
<p id="text"></p>
</div>

</div>
</div>

<script>
function scan(){
let uid=document.getElementById("uid").value;
let server=document.getElementById("server").value;

if(uid==""){
alert("UID dalo");
return;
}
document.getElementById("result").style.display="block";
document.getElementById("text").innerHTML=
"UID: "+uid+"<br>Server: "+server+"<br>Status: Demo";
}
</script>

</body>
</html>
