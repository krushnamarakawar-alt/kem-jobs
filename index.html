<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FF LOBBY PRO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(180deg,#02111f,#000);
color:white;
overflow-x:hidden;
}

canvas{
position:fixed;
inset:0;
z-index:-1;
}

.topbar{
display:flex;
justify-content:space-between;
padding:15px;
font-size:20px;
font-weight:bold;
color:#00e5ff;
}

.profile{
text-align:center;
padding:10px 20px;
}

.avatar{
width:170px;
height:170px;
margin:auto;
border-radius:50%;
border:4px solid #00e5ff;
box-shadow:0 0 35px #00e5ff;
display:flex;
align-items:center;
justify-content:center;
font-size:80px;
animation:float 3s infinite ease-in-out;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-12px)}
}

.name{
font-size:34px;
color:#00e5ff;
margin-top:15px;
}

.level{
margin-top:10px;
}

.bar{
height:10px;
background:#333;
border-radius:20px;
overflow:hidden;
margin-top:8px;
}

.fill{
height:100%;
width:78%;
background:#00e5ff;
}

.panel{
width:92%;
max-width:380px;
margin:20px auto;
background:#0d0d0d;
padding:20px;
border-radius:20px;
box-shadow:0 0 20px #00e5ff44;
}

input,select,button{
width:100%;
padding:13px;
margin:10px 0;
border:none;
border-radius:12px;
font-size:17px;
}

input,select{
background:#222;
color:white;
}

button{
background:#00e5ff;
color:black;
font-weight:bold;
box-shadow:0 0 20px #00e5ff;
}

.status{
display:none;
text-align:center;
margin-top:15px;
color:#00e5ff;
font-weight:bold;
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:15px;
}

.card{
background:#111;
padding:18px;
border-radius:15px;
text-align:center;
border:1px solid #00e5ff33;
box-shadow:0 0 10px #00e5ff22;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.footer{
text-align:center;
padding:25px;
color:#00e5ff;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="topbar">
<div>💎 99999</div>
<div>🪙 999999</div>
</div>

<div class="profile">
<div class="avatar">🎮</div>
<div class="name">FF LOBBY PRO</div>

<div class="level">
Level 75
<div class="bar">
<div class="fill"></div>
</div>
</div>
</div>

<div class="panel">
<input id="uid" placeholder="Enter UID">

<select id="server">
<option>India</option>
<option>Brazil</option>
<option>Singapore</option>
<option>Middle East</option>
</select>

<button onclick="runDemo()">START</button>

<div class="status" id="status">Demo Complete ✅</div>
</div>

<div class="cards">
<div class="card">🔫 AK47<br>Epic</div>
<div class="card">⚡ MP40<br>Legendary</div>
<div class="card">🎯 M1887<br>Mythic</div>
<div class="card">🔥 EVO GUN<br>Max</div>
</div>

<div class="footer">
Gaming Style Demo UI
</div>

<script>
function runDemo(){
let uid=document.getElementById("uid").value;
if(uid===""){alert("Enter UID");return;}
document.getElementById("status").style.display="block";
}

// Moving Particles
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let p=[];
for(let i=0;i<70;i++){
p.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*3+1,v:Math.random()*1+0.3});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#00e5ff";
for(let a of p){
ctx.beginPath();
ctx.arc(a.x,a.y,a.r,0,Math.PI*2);
ctx.fill();
a.y-=a.v;
if(a.y<0)a.y=canvas.height;
}
requestAnimationFrame(draw);
}
draw();

onresize=()=>{
canvas.width=innerWidth;
canvas.height=innerHeight;
};
</script>

</body>
</html>
