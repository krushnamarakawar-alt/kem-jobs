<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FF Lobby Demo</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:#050505;
color:white;
overflow-x:hidden;
background:radial-gradient(circle at top,#003b66,#050505);
}

.topbar{
position:fixed;
top:12px;
left:12px;
right:12px;
display:flex;
justify-content:space-between;
font-size:18px;
font-weight:bold;
color:#00e5ff;
z-index:10;
}

.hero{
padding-top:60px;
text-align:center;
}

.avatar{
width:170px;
height:170px;
margin:auto;
border-radius:50%;
border:3px solid #00e5ff;
box-shadow:0 0 25px #00e5ff;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
animation:float 2s infinite ease-in-out;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

.card{
width:92%;
max-width:360px;
margin:20px auto;
background:#111;
padding:20px;
border-radius:20px;
box-shadow:0 0 20px #00e5ff55;
}

input,select,button{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
}

input,select{
background:#222;
color:white;
}

button{
background:#00e5ff;
color:black;
font-weight:bold;
box-shadow:0 0 15px #00e5ff;
}

.weapons{
padding:20px;
}

.weapon{
background:#111;
padding:12px;
margin:10px 0;
border-radius:12px;
border:1px solid #00e5ff55;
display:flex;
justify-content:space-between;
}
</style>
</head>

<body>

<div class="topbar">
<span>💎99999</span>
<span>🪙999999</span>
</div>

<div class="hero">
<div class="avatar">🎮</div>
<h1 style="color:#00e5ff;margin-top:15px;">FF LOBBY DEMO</h1>
</div>

<div class="card">
<input placeholder="Enter UID">
<select>
<option>India</option>
<option>Brazil</option>
<option>Singapore</option>
</select>
<button>START</button>
</div>

<div class="weapons">
<h2 style="color:#00e5ff;">Popular Weapons</h2>

<div class="weapon">
<span>🔫 AK47</span>
<span>Epic</span>
</div>

<div class="weapon">
<span>⚡ MP40</span>
<span>Legendary</span>
</div>

<div class="weapon">
<span>🎯 M1887</span>
<span>Mythic</span>
</div>

</div>

</body>
</html>
